<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DovCraft</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;user-select:none}
canvas#c{display:block;width:100%;height:100%}
#cross{position:fixed;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;pointer-events:none;mix-blend-mode:difference}
#cross:before,#cross:after{content:"";position:absolute;background:#fff}
#cross:before{left:9px;top:0;width:2px;height:20px}
#cross:after{top:9px;left:0;height:2px;width:20px}
#hotbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;background:rgba(0,0,0,.45);border-radius:6px}
.slot{width:46px;height:46px;border:3px solid #555;background:rgba(40,40,40,.6);position:relative;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.slot.sel{border-color:#fff;background:rgba(90,90,90,.7)}
.slot canvas{width:34px;height:34px;image-rendering:pixelated}
.slot span{position:absolute;left:2px;top:0;font-size:10px;color:#ddd;text-shadow:1px 1px #000}
#bname{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);font-size:16px;text-shadow:1px 1px 2px #000;opacity:0;transition:opacity .4s;pointer-events:none}
#info{position:fixed;left:8px;top:8px;font:12px/1.4 monospace;text-shadow:1px 1px #000;pointer-events:none;white-space:pre}
#water{position:fixed;inset:0;background:rgba(30,70,190,.45);pointer-events:none;display:none}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
#menu h1{font-size:52px;letter-spacing:6px;margin:0 0 8px;text-shadow:3px 3px 0 #2e6b1e,6px 6px 0 #000}
#menu p{margin:4px 0;color:#ccc;font-size:14px}
#menu .keys{display:grid;grid-template-columns:auto auto;gap:4px 18px;text-align:left;margin:16px 0;font-size:14px}
#menu .keys b{color:#9fe070}
#load{position:fixed;inset:0;background:#1b2a14;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:25}
#bar{width:260px;height:10px;background:#0006;margin-top:14px;border-radius:5px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#7cd34d}
html,body{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#menu{overflow:auto}
#touch{display:none}
body.touch #touch{display:block}
body.touch #info{font-size:10px}
body.touch .slot{width:36px;height:36px;border-width:2px}
body.touch .slot canvas{width:26px;height:26px}
body.touch .slot span{display:none}
body.touch #hotbar{bottom:8px;gap:2px;padding:3px}
body.touch #bname{bottom:56px}
.tb{position:fixed;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1;z-index:5;box-sizing:border-box}
.tb small{font-size:9px;margin-top:2px;opacity:.85}
.tb.on{background:rgba(255,255,255,.42)}
#bPlace{right:12px;bottom:84px;width:68px;height:68px}
#bBreak{right:92px;bottom:66px;width:68px;height:68px}
#bJump{right:12px;bottom:168px}
#bFly{right:92px;bottom:148px;width:54px;height:54px}
#bDown{right:160px;bottom:200px;width:54px;height:54px;display:none}
#bMenu{right:10px;top:10px;width:40px;height:40px;font-size:18px}
#joyBase{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);display:none;pointer-events:none;z-index:4}
#joyKnob{position:absolute;left:32px;top:32px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.4)}
@media (max-height:520px){#menu h1{font-size:30px;margin:0}#menu .keys{margin:6px 0;font-size:12px}.btn{padding:8px 24px;font-size:15px}#menu{justify-content:flex-start;padding-top:8px}}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
#shade{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.05),rgba(0,0,0,.55))}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px;overflow:auto}
.screen.on{display:flex}
.logo{font-size:clamp(34px,9vw,76px);font-weight:900;letter-spacing:.12em;margin:0 0 4px;color:#e9e9e9;text-shadow:0 .06em 0 #6b6b6b,0 .12em 0 #3d3d3d,0 .2em .25em rgba(0,0,0,.6);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.sub{color:#ffe36a;font-size:clamp(12px,2.4vw,16px);margin-bottom:clamp(14px,4vh,34px);text-shadow:1px 1px #000;transform:rotate(-2deg)}
h2{margin:0 0 14px;font-size:clamp(20px,4vw,28px);text-shadow:2px 2px #000}
.col{display:flex;flex-direction:column;gap:10px;width:min(360px,92vw)}
.btn{font:inherit;font-size:clamp(15px,2.6vw,19px);color:#fff;text-shadow:2px 2px #333;padding:13px 16px;cursor:pointer;text-align:center;
 background:#7d7d7d;border:3px solid #000;box-shadow:inset 3px 3px 0 #b9b9b9,inset -3px -3px 0 #4b4b4b;transition:none}
.btn:hover,.btn:focus-visible{background:#6f7fb8;box-shadow:inset 3px 3px 0 #a9b6ea,inset -3px -3px 0 #3d4a82;outline:none}
.btn:active{transform:translateY(2px)}
.btn.green{background:#5d9b3a;box-shadow:inset 3px 3px 0 #9ad46f,inset -3px -3px 0 #346119}
.btn.green:hover{background:#6bb544}
.btn small{display:block;font-size:11px;opacity:.85;margin-top:3px;text-shadow:none}
.btn.sel{background:#5d9b3a;box-shadow:inset 3px 3px 0 #9ad46f,inset -3px -3px 0 #346119}
.row{display:flex;gap:8px}.row>*{flex:1}
.panel{width:min(440px,94vw);background:rgba(25,25,25,.78);border:3px solid #000;box-shadow:inset 3px 3px 0 #555,inset -3px -3px 0 #151515;padding:18px;display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
label{font-size:13px;color:#ddd;display:flex;flex-direction:column;gap:6px;text-shadow:1px 1px #000}
label b{display:flex;justify-content:space-between;font-weight:normal}
label b span{color:#ffe36a}
input[type=text]{font:inherit;font-size:16px;padding:10px;background:#111;color:#fff;border:2px solid #888;outline:none;width:100%;-webkit-user-select:text;user-select:text}
input[type=text]:focus{border-color:#fff}
input[type=range]{width:100%;accent-color:#7cd34d;height:26px}
.hint{font-size:12px;color:#bbb;line-height:1.4;min-height:32px;text-shadow:1px 1px #000}
.foot{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:#ddd;text-shadow:1px 1px #000;pointer-events:none}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-80px);background:#222;border:2px solid #7cd34d;padding:10px 18px;transition:transform .3s;z-index:9;font-size:14px}
#toast.show{transform:translate(-50%,0)}
@media (max-height:480px){.logo{font-size:34px}.sub{margin-bottom:8px}.btn{padding:8px 12px}.col{gap:6px}.panel{padding:12px;gap:8px}}

#bg{z-index:10}#shade{z-index:11}.screen{z-index:20;touch-action:pan-y}#toast{z-index:30}
#s-pause{background:rgba(0,0,0,.55)}
body.playing #bg,body.playing #shade{display:none}

.corner{position:fixed;right:10px;bottom:10px;width:auto;padding:7px 14px;font-size:14px}
.svlist{max-height:30vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.sv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:#111;border:2px solid #555;cursor:pointer;font-size:14px}
.sv:hover{border-color:#7cd34d}.sv small{color:#bbb}
#frInfo{white-space:pre-line;color:#fff;font-size:14px}
#frCtl{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cross"></div>
<div id="info"></div>
<div id="bname"></div>
<div id="hotbar"></div>
<div id="water"></div>
<div id="touch">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div class="tb" id="bPlace">▣<small>поставить</small></div>
  <div class="tb" id="bBreak">⛏<small>сломать</small></div>
  <div class="tb" id="bJump">⤒<small>прыжок</small></div>
  <div class="tb" id="bFly">✈<small>полёт</small></div>
  <div class="tb" id="bDown">⤓<small>вниз</small></div>
  <div class="tb" id="bMenu">☰</div>
  <div class="tb" id="bInv">🎒</div>
</div>
<div id="load"><div style="font-size:22px">Генерация мира…</div><div id="bar"><i></i></div></div>
<canvas id="bg"></canvas><div id="shade"></div>

<!-- Главное меню -->
<section class="screen on" id="s-main">
  <h1 class="logo">DOVCRAFT</h1>
  <div class="sub" data-i18n="tagline"></div>
  <div class="col">
    <button class="btn green" id="bPlay"><span data-i18n="play"></span><small id="worldInfo"></small></button>
    <button class="btn" id="bNew" data-i18n="newWorld"></button>
    <button class="btn" id="bSet" data-i18n="settings"></button>
    <button class="btn corner" id="bServers">🌐 <span data-i18n="servers"></span></button>
  </div>
  <div class="foot" data-i18n="footer"></div>
</section>

<!-- Новый мир -->
<section class="screen" id="s-new">
  <div class="panel">
    <h2 data-i18n="newWorld"></h2>
    <label><b data-i18n="worldName"></b><input type="text" id="wName" maxlength="24" autocomplete="off"></label>
    <label><b data-i18n="gameMode"></b>
      <div class="row">
        <button class="btn sel" id="mSurv" data-i18n="survival"></button>
        <button class="btn" id="mCre" data-i18n="creative"></button>
      </div>
      <div class="hint" id="modeHint"></div>
    </label>
    <label><b data-i18n="seed"></b><input type="text" id="wSeed" autocomplete="off"></label>
    <div class="row"><button class="btn" id="nBack" data-i18n="back"></button><button class="btn green" id="nCreate" data-i18n="create"></button></div>
  </div>
</section>

<!-- Настройки -->
<section class="screen" id="s-set">
  <div class="panel">
    <h2 data-i18n="settings"></h2>
    <label><b data-i18n="language"></b>
      <div class="row" id="langRow"></div>
    </label>
    <label><b><em data-i18n="sens" style="font-style:normal"></em><span id="vSens"></span></b><input type="range" id="rSens" min="1" max="10" step="1"></label>
    <label><b><em data-i18n="dist" style="font-style:normal"></em><span id="vDist"></span></b><input type="range" id="rDist" min="1" max="4" step="1"></label>
    <label><b><em data-i18n="fov" style="font-style:normal"></em><span id="vFov"></span></b><input type="range" id="rFov" min="60" max="110" step="5"></label>
    <button class="btn green" id="sBack" data-i18n="done"></button>
  </div>
</section>




<section class="screen" id="s-servers"><div class="panel">
  <h2 data-i18n="servers"></h2>
  <label><b data-i18n="nick"></b><input type="text" id="svNick" maxlength="16" autocomplete="off"></label>
  <div class="row"><input type="text" id="svQ" maxlength="24" autocomplete="off"><button class="btn green" id="svGo" data-i18n="joinFind"></button></div>
  <div class="hint" id="svStat"></div>
  <div class="svlist" id="svList"></div>
  <div class="row"><button class="btn" id="svRef" data-i18n="refresh"></button><button class="btn" id="svNew" data-i18n="createServer"></button></div>
  <button class="btn" id="svBack" data-i18n="back"></button>
</div></section>

<section class="screen" id="s-snew"><div class="panel">
  <h2 data-i18n="srvNew"></h2>
  <label><b data-i18n="worldName"></b><input type="text" id="snName" maxlength="24" autocomplete="off"></label>
  <label><b data-i18n="gameMode"></b><div class="row"><button class="btn sel" id="snSurv" data-i18n="survival"></button><button class="btn" id="snCre" data-i18n="creative"></button></div></label>
  <label><b data-i18n="seed"></b><input type="text" id="snSeed" autocomplete="off"></label>
  <label><b data-i18n="visibility"></b><div class="row"><button class="btn sel" id="snVisList" data-i18n="visList"></button><button class="btn" id="snVisHide" data-i18n="visHide"></button></div></label>
  <button class="btn" id="snLock"></button>
  <input type="text" id="snPw" maxlength="16" autocomplete="off" style="display:none">
  <div class="row"><button class="btn" id="snBack" data-i18n="back"></button><button class="btn green" id="snCreate" data-i18n="create"></button></div>
</div></section>

<section class="screen" id="s-friends"><div class="panel">
  <h2 data-i18n="friends"></h2>
  <div id="frCtl">
    <button class="btn" id="frOn"></button>
    <label><b data-i18n="visibility"></b><div class="row"><button class="btn sel" id="frVisList" data-i18n="visList"></button><button class="btn" id="frVisHide" data-i18n="visHide"></button></div></label>
    <button class="btn" id="frLock"></button>
    <input type="text" id="frPw" maxlength="16" autocomplete="off" style="display:none">
  </div>
  <div class="hint" id="frInfo"></div>
  <button class="btn" id="frCopy" data-i18n="copy"></button>
  <button class="btn" id="frBack" data-i18n="back"></button>
</div></section>

<div id="toast"></div>

<section class="screen" id="s-pause"><div class="panel">
  <h2 id="pTitle"></h2>
  <div class="hint" id="keysDesk" data-i18n="ctrlD"></div>
  <div class="hint" id="keysTouch" data-i18n="ctrlT" style="display:none"></div>
  <button class="btn green" id="pResume" data-i18n="resume"></button>
  <button class="btn" id="pSet" data-i18n="settings"></button>
  <button class="btn" id="pMenu" data-i18n="toMenu"></button>
</div></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" onerror="var q=document.createElement('script');q.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';document.head.appendChild(q)"></script>
<script>
(() => {
'use strict';
/* ========== Переводы ========== */
const T = {
  ru: { name:'Русский', tagline:'Построй свой мир!', play:'Начать играть', newWorld:'Новый мир', settings:'Настройки', footer:'DovCraft · своя воксельная игра',
    worldName:'Название мира', gameMode:'Режим игры', survival:'Выживание', creative:'Творчество', seed:'Сид мира (необязательно)',
    hintSurv:'Добывай ресурсы, крафти предметы и выживай. Есть здоровье и голод.', hintCre:'Бесконечные блоки, полёт и никакой опасности. Строй что угодно.',
    back:'Назад', create:'Создать мир', language:'Язык', sens:'Чувствительность камеры', dist:'Дальность прорисовки', fov:'Угол обзора',
    done:'Готово', starting:'Запуск мира', stubNote:'Это отдельное меню. Следующим шагом подключу его к игре.', toMenu:'В главное меню',
    noWorld:'Сохранённого мира нет — создайте новый', mode:'Режим', dists:['Близко','Средняя','Дальняя','Макс.'],
    confirmNew:'Старый мир будет удалён. Продолжить?', defName:'Новый мир', created:'Мир создан', saved:'Настройки сохранены' },
  en: { name:'English', tagline:'Build your own world!', play:'Play', newWorld:'New World', settings:'Settings', footer:'DovCraft · a voxel game of its own',
    worldName:'World name', gameMode:'Game mode', survival:'Survival', creative:'Creative', seed:'World seed (optional)',
    hintSurv:'Gather resources, craft items and survive. Health and hunger enabled.', hintCre:'Unlimited blocks, flying and no danger. Build anything.',
    back:'Back', create:'Create World', language:'Language', sens:'Camera sensitivity', dist:'Render distance', fov:'Field of view',
    done:'Done', starting:'Starting world', stubNote:'This is a standalone menu. Next step: wiring it into the game.', toMenu:'Main menu',
    noWorld:'No saved world — create a new one', mode:'Mode', dists:['Near','Normal','Far','Max'],
    confirmNew:'The old world will be deleted. Continue?', defName:'New World', created:'World created', saved:'Settings saved' },
  kk: { name:'Қазақша', tagline:'Өз әлеміңді құр!', play:'Ойнауды бастау', newWorld:'Жаңа әлем', settings:'Баптаулар', footer:'DovCraft · өзіндік воксельдік ойын',
    worldName:'Әлем атауы', gameMode:'Ойын режимі', survival:'Аман қалу', creative:'Шығармашылық', seed:'Әлем сиді (міндетті емес)',
    hintSurv:'Ресурс жина, бұйымдар жаса және аман қал. Денсаулық пен аштық бар.', hintCre:'Шексіз блоктар, ұшу және қауіпсіздік. Кез келген нәрсе сал.',
    back:'Артқа', create:'Әлем құру', language:'Тіл', sens:'Камера сезімталдығы', dist:'Көріну қашықтығы', fov:'Көру бұрышы',
    done:'Дайын', starting:'Әлем іске қосылуда', stubNote:'Бұл бөлек мәзір. Келесі қадам — оны ойынға қосу.', toMenu:'Басты мәзір',
    noWorld:'Сақталған әлем жоқ — жаңасын құрыңыз', mode:'Режим', dists:['Жақын','Орташа','Алыс','Максимум'],
    confirmNew:'Ескі әлем жойылады. Жалғастырасыз ба?', defName:'Жаңа әлем', created:'Әлем құрылды', saved:'Баптаулар сақталды' }
};

Object.assign(T.ru, { paused:'Пауза', ready:'Мир готов', resume:'Продолжить',
  ctrlD:'WASD — движение · Пробел — прыжок · Shift — бег · F — полёт · ЛКМ — ломать · ПКМ — ставить · 1–9 / колесо — выбор · E — инвентарь · Esc — пауза',
  ctrlT:'Левый палец — движение · Правый — осмотр · ⛏ ломать · ▣ ставить · ⤒ прыжок · 🎒 инвентарь · ☰ пауза' });
Object.assign(T.en, { paused:'Paused', ready:'World ready', resume:'Resume',
  ctrlD:'WASD — move · Space — jump · Shift — sprint · F — fly · LMB — break · RMB — place · 1–9 / wheel — pick · E — inventory · Esc — pause',
  ctrlT:'Left thumb — move · Right — look · ⛏ break · ▣ place · ⤒ jump · 🎒 inventory · ☰ pause' });
Object.assign(T.kk, { paused:'Үзіліс', ready:'Әлем дайын', resume:'Жалғастыру',
  ctrlD:'WASD — жүру · Бос орын — секіру · Shift — жүгіру · F — ұшу · СЛТ — бұзу · ОЛТ — қою · 1–9 / дөңгелек — таңдау · E — инвентарь · Esc — үзіліс',
  ctrlT:'Сол саусақ — жүру · Оң — қарау · ⛏ бұзу · ▣ қою · ⤒ секіру · 🎒 инвентарь · ☰ үзіліс' });

/* ========== Хранилище ========== */
const SK = 'blockcraft_settings', WK = 'blockcraft_world_meta';
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const guess = (navigator.language || 'ru').slice(0, 2);
const settings = Object.assign({ lang: T[guess] ? guess : 'ru', sens: 5, dist: 3, fov: 75 }, ls.get(SK, {}));
let world = ls.get(WK, null);
let mode = 'survival';

const $ = id => document.getElementById(id);
const t = k => (T[settings.lang] && T[settings.lang][k]) || T.ru[k] || k;

/* ========== Отрисовка текста ========== */
function applyLang() {
  document.documentElement.lang = settings.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('wName').placeholder = t('defName');
  $('modeHint').textContent = t(mode === 'survival' ? 'hintSurv' : 'hintCre');
  $('worldInfo').textContent = world ? world.name + ' · ' + t(world.mode) : t('noWorld');
  $('vDist').textContent = t('dists')[settings.dist - 1];
  document.querySelectorAll('#langRow .btn').forEach(b => b.classList.toggle('sel', b.dataset.l === settings.lang));
}
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 1600); }
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

/* ========== Язык ========== */

  NET.role = null; NET.status = ''; hostConn = null; clientPeer = null;
  try { if (c) c.close(); } catch (e) {}
  kill(p); clearRemotes();
}
function netDrop(msg) { cleanup(); toast(msg); G().exitToMenu(); }
function clientMsg(d) {
  switch (d.t) {
    case 'pos': if (d.id !== myId) setRemote(d.id, d); break;
    case 'join': addRemote(d.id, d.name, { x: 0, y: -50, z: 0, yw: 0, pt: 0 }); break;
    case 'leave': delRemote(d.id); break;
    case 'blk': if ([d.x, d.y, d.z, d.b].every(Number.isInteger)) G().applyBlock(d.x, d.y, d.z, d.b); break;
    case 'mobs': if (Array.isArray(d.l)) G().mobApply(d.l); break;
    case 'furs': { const f = G().furnaces; for (const k in f) delete f[k]; if (d.f && typeof d.f === 'object') for (const k in d.f) { const c = cleanFur(d.f[k]); if (c) f[k] = c; } break; }
    case 'fur': { const c = cleanFur(d.f); if (c && /^\d+$/.test(String(d.k))) G().furnaces[d.k] = c; break; }
    case 'tod': if (Number.isFinite(d.v)) G().setTod(d.v); break;
    case 'drop': if (Array.isArray(d.items)) G().giveItems(d.items); break;
    case 'chest': { if (/^\d+$/.test(String(d.k))) { if (d.c === null) delete G().chests[d.k]; else { const c = cleanChest(d.c); if (c) G().chests[d.k] = c; } } break; }
    case 'drops': if (Array.isArray(d.l)) G().dropsApply(d.l); break;
    case 'dgive': G().giveStack(d.item); break;
    case 'hurt': if (Number.isFinite(d.dmg) && Number.isFinite(d.fx) && Number.isFinite(d.fz)) G().hurtMe(Math.max(1, Math.min(12, d.dmg)), d.fx, d.fz); break;
    case 'blks': if (Array.isArray(d.l) && d.l.length <= 700) G().applyBlocks(d.l.filter(q => Array.isArray(q) && q.length === 4 && q.every(Number.isInteger))); break;
    case 'note': if (typeof d.s === 'string') G().notify(d.s.slice(0, 80)); break;
    case 'close': netDrop(tr('hostClosed')); break;
  }
}
function join(code, pw, cb) {
  if (!hasPeer()) return cb('nopeer');
  if (NET.role) return cb('busy');
  const p = new Peer(); let done = false;
  const fail = e => { if (done) return; done = true; clearTimeout(to); kill(p); cb(e); };
  const to = setTimeout(() => fail('timeout'), 15000);
  p.on('error', e => fail(e.type));
  p.on('open', () => {
    const c = p.connect(PFX + code, { reliable: true });
    c.on('open', () => snd(c, { t: 'hello', name: nick, pw }));
    c.on('data', d => {
      if (!d || typeof d !== 'object') return;
      if (!done) {
        if (d.t === 'deny') return fail(d.r);
        if (d.t === 'welcome') {
          done = true; clearTimeout(to);
          clientPeer = p; hostConn = c; NET.role = 'client'; NET.code = code; myId = d.id;
          const edits = {}; for (let i = 0; i + 1 < d.e.length; i += 2) edits[d.e[i]] = d.e[i + 1];
          BC.launchRemote({ name: d.name, mode: d.mode, seed: d.seed }, { edits, tod: d.tod });
          G().worldName = d.name;
          for (const k in (d.fu || {})) { const c = cleanFur(d.fu[k]); if (c) G().furnaces[k] = c; }
          for (const k in (d.ch || {})) { const c = cleanChest(d.ch[k]); if (c) G().chests[k] = c; }
          (d.players || []).forEach(q => addRemote(q.id, q.name, q));
          cb(null);
        }
        return;
      }
      clientMsg(d);
    });
    c.on('close', () => { if (NET.role === 'client' && hostConn === c) netDrop(tr('lostConn')); });
  });
}

/* ===== Хуки игры ===== */
let sendT = 0, mobT = 0, furT = 0, todT = 0, dropT = 0;
NET.onBlock = (x, y, z, b) => {
  if (NET.role === 'host') bcast({ t: 'blk', x, y, z, b });
  else if (NET.role === 'client') snd(hostConn, { t: 'blk', x, y, z, b });
};
NET.hitMob = (id, dmg) => snd(hostConn, { t: 'hit', id, dmg });
NET.giveDrops = (kid, items) => { const u = conns.get(kid); if (u) snd(u.c, { t: 'drop', items }); };
NET.onFurnace = (k, f) => { if (NET.role === 'host') bcast({ t: 'fur', k, f }); else if (NET.role === 'client') snd(hostConn, { t: 'fur', k, f }); };
NET.onChest = (k, c) => { if (!c) return; if (NET.role === 'host') bcast({ t: 'chest', k, c }); else if (NET.role === 'client') snd(hostConn, { t: 'chest', k, c }); };
NET.dropReq = (item, x, y, z, vx, vy, vz) => snd(hostConn, { t: 'dreq', item, x, y, z, vx, vy, vz });
NET.pickReq = id => snd(hostConn, { t: 'pick', id });
NET.onSleep = () => { if (NET.role === 'host') bcast({ t: 'tod', v: G().tod() }); else if (NET.role === 'client') snd(hostConn, { t: 'sleep' }); };
NET.players = () => { const l = []; for (const [id, r] of remotes) if (!r.fresh) l.push({ id, x: r.g.position.x, y: r.g.position.y, z: r.g.position.z }); return l; };
NET.hitPlayer = (id, dmg) => {
  if (NET.role === 'client') snd(hostConn, { t: 'pvp', id, dmg });
  else if (NET.role === 'host' && id !== 0) { const u = conns.get(id); if (u) { const sp = selfPos(); snd(u.c, { t: 'hurt', dmg, fx: sp.x, fz: sp.z }); G().defendOwner(id, { k: 'pl', id: 0 }); } }
};
NET.hurtClient = (id, dmg, fx, fz) => { const u = conns.get(id); if (u) snd(u.c, { t: 'hurt', dmg, fx, fz }); };
NET.onDeath = () => { if (NET.role === 'client') snd(hostConn, { t: 'died' }); };
NET.tameReq = id => { if (NET.role === 'client') snd(hostConn, { t: 'tame', id }); };
NET.onBlocks = l => { if (NET.role === 'host') bcast({ t: 'blks', l }); };
NET.pickPos = () => { const g = G(), l = [{ x: g.pos.x, z: g.pos.z }]; for (const r of remotes.values()) if (r.t.y > -40) l.push({ x: r.t.x, z: r.t.z }); return l[(Math.random() * l.length) | 0]; };
NET.tick = dt => {
  if (!NET.role) return;
  const k = Math.min(1, dt * 12);
  for (const r of remotes.values()) { r.g.position.lerp(r.t, k); r.g.rotation.y = r.yaw; r.head.rotation.x = r.pt; }
  sendT -= dt;
  if (sendT <= 0) {
    sendT = 0.1;
    const m = Object.assign({ t: 'pos' }, selfPos());
    if (NET.role === 'host') { m.id = 0; bcast(m); } else snd(hostConn, m);
  }
  if (NET.role === 'host') {
    mobT -= dt; if (mobT <= 0) { mobT = 0.15; bcast({ t: 'mobs', l: G().mobSnap() }); }
    furT -= dt; if (furT <= 0) { furT = 1; if (Object.keys(G().furnaces).length) bcast({ t: 'furs', f: G().furnaces }); }
    todT -= dt; if (todT <= 0) { todT = 5; bcast({ t: 'tod', v: G().tod() }); }
    dropT -= dt; if (dropT <= 0) { dropT = 0.2; bcast({ t: 'drops', l: G().dropsSnap() }); }
  } else G().mobStep(dt);
  NET.status = '🌐 ' + NET.code + ' · ' + (remotes.size + 1) + ' ' + (NET.role === 'host' ? '(' + tr('srvCode').toLowerCase() + ')' : '');
};
NET.leave = () => { if (NET.role === 'host') stopHosting(); else if (NET.role === 'client') cleanup(); };
window.addEventListener('blockcraft:start', e => {
  const w = e.detail.world;
  if (e.detail.remote) return;
  const mp = w.mp || {};
  opts = { hidden: !!mp.hidden, lock: !!mp.pw, pw: mp.pw || '' };
});

/* ===== Интерфейс: экран «Серверы» ===== */
let nick0 = nick;
const stat = s => { $('svStat').textContent = s || ''; };
const errText = e => e === 'pw' ? tr('wrongCode') : e === 'full' ? tr('full') : e === 'peer-unavailable' ? tr('notFound') : e === 'nopeer' ? tr('noPeer') : tr('netErr') + e;
function renderList(items) {
  const box = $('svList'); box.innerHTML = '';
  items.forEach(it => {
    const el = document.createElement('div'); el.className = 'sv';
    const l = document.createElement('div'); const nm = document.createElement('b'); nm.textContent = (it.locked ? '🔒 ' : '') + it.name;
    const sm = document.createElement('small'); sm.textContent = tr(it.mode) + ' · ' + it.code;
    l.appendChild(nm); l.appendChild(document.createElement('br')); l.appendChild(sm);
    const r = document.createElement('div'); r.textContent = '👥 ' + it.players;
    el.appendChild(l); el.appendChild(r);
    el.onclick = () => attemptJoin(it.code, it.locked ? prompt(tr('enterCode')) : '', null);
    if (it.locked) el.onclick = () => { const p = prompt(tr('enterCode')); if (p !== null) attemptJoin(it.code, p, null); };
    box.appendChild(el);
  });
}
function attemptJoin(code, pw, onMissing) {
  stat(tr('connecting'));
  join(code, pw || '', err => {
    if (!err) return;
    if (err === 'pw') { const p = prompt(tr('enterCode')); if (p !== null) return attemptJoin(code, p, onMissing); }
    if (err === 'peer-unavailable' && onMissing) return onMissing();
    stat(errText(err));
  });
}
function refreshList() {
  stat(tr('loading'));
  fetchList({ t: 'list' }, (e, items) => { if (e) { stat(tr('hubErr')); renderList([]); } else { stat(items.length ? '' : tr('noServers')); renderList(items); } });
}
function searchGo() {
  const q = $('svQ').value.trim();
  if (!q) return refreshList();
  const search = () => { stat(tr('searching')); fetchList({ t: 'find', q }, (e, items) => { if (e) return stat(tr('hubErr')); renderList(items); stat(items.length ? '' : tr('notFound')); }); };
  if (/^[A-Za-z0-9]{6}$/.test(q)) attemptJoin(q.toUpperCase(), '', search); else search();
}
$('bServers').onclick = () => { $('svNick').value = nick; $('svQ').placeholder = tr('searchPh'); $('svQ').value = ''; BC.show('s-servers'); refreshList(); };
$('svNick').addEventListener('input', () => { nick = cleanName($('svNick').value); try { localStorage.setItem('dovcraft_nick', nick); } catch (e) {} });
$('svGo').onclick = searchGo;
$('svQ').addEventListener('keydown', e => { if (e.key === 'Enter') searchGo(); });
$('svRef').onclick = refreshList;
$('svBack').onclick = () => BC.show('s-main');
$('svNew').onclick = () => { $('snName').value = ''; $('snSeed').value = ''; $('snPw').value = ''; snMode = 'survival'; snHidden = false; snLock = false; snRender(); BC.show('s-snew'); };

/* ===== Интерфейс: создание мира на серверах ===== */
let snMode = 'survival', snHidden = false, snLock = false;
function snRender() {
  $('snSurv').classList.toggle('sel', snMode === 'survival'); $('snCre').classList.toggle('sel', snMode === 'creative');
  $('snVisList').classList.toggle('sel', !snHidden); $('snVisHide').classList.toggle('sel', snHidden);
  $('snLock').classList.toggle('sel', snLock); $('snLock').textContent = tr('needCode') + ': ' + tr(snLock ? 'on' : 'off');
  $('snPw').style.display = snLock ? '' : 'none';
}
$('snSurv').onclick = () => { snMode = 'survival'; snRender(); };
$('snCre').onclick = () => { snMode = 'creative'; snRender(); };
$('snVisList').onclick = () => { snHidden = false; snRender(); };
$('snVisHide').onclick = () => { snHidden = true; snRender(); };
$('snLock').onclick = () => { snLock = !snLock; snRender(); };
$('snBack').onclick = () => BC.show('s-servers');
$('snCreate').onclick = () => {
  const pw = snLock ? $('snPw').value.trim() : '';
  if (snLock && !pw) return toast(tr('needPw'));
  const txt = $('snSeed').value.trim(); let seed;
  if (!txt) seed = (Math.random() * 1e9) | 0;
  else if (/^-?\d+$/.test(txt)) seed = parseInt(txt, 10);
  else { seed = 0; for (const ch of txt) seed = (Math.imul(seed, 31) + ch.charCodeAt(0)) | 0; }
  BC.launchWorld({ name: $('snName').value.trim() || tr('defServer'), mode: snMode, seed, created: Date.now(), mp: { hidden: snHidden, pw } });
};

/* ===== Интерфейс: «С друзьями» в паузе ===== */
const pf = document.createElement('button');
pf.className = 'btn'; pf.id = 'pFriends'; pf.dataset.i18n = 'friends';
$('pMenu').parentNode.insertBefore(pf, $('pMenu'));
BC.refresh();
function frRender() {
  const host = NET.role === 'host', cli = NET.role === 'client';
  $('frCtl').style.display = cli ? 'none' : 'flex';
  $('frOn').classList.toggle('sel', host); $('frOn').textContent = tr('friendsMode') + ': ' + tr(host ? 'on' : 'off');
  $('frVisList').classList.toggle('sel', !opts.hidden); $('frVisHide').classList.toggle('sel', opts.hidden);
  $('frLock').classList.toggle('sel', opts.lock); $('frLock').textContent = tr('needCode') + ': ' + tr(opts.lock ? 'on' : 'off');
  $('frPw').style.display = opts.lock ? '' : 'none';
  $('frInfo').textContent = host ? tr('srvCode') + ': ' + NET.code + '\n' + tr('playersN') + ': ' + (conns.size + 1)
    : cli ? tr('connectedTo') + ': ' + (G().worldName || '') + '\n' + tr('srvCode') + ': ' + NET.code : tr('offHint');
  $('frCopy').style.display = NET.role ? '' : 'none';
}
pf.onclick = () => { $('frPw').value = opts.pw; frRender(); BC.show('s-friends'); };
$('frBack').onclick = () => BC.show('s-pause');
$('frOn').onclick = () => {
  if (NET.role === 'client') return;
  if (NET.role === 'host') { stopHosting(); frRender(); return; }
  if (opts.lock && !opts.pw) return toast(tr('needPw'));
  startHosting((ok, err) => { toast(ok ? tr('onlineStarted') : tr('netErr') + (err || '')); frRender(); });
};
$('frVisList').onclick = () => { opts.hidden = false; announce(); frRender(); };
$('frVisHide').onclick = () => { opts.hidden = true; announce(); frRender(); };
$('frLock').onclick = () => { opts.lock = !opts.lock; announce(); frRender(); };
$('frPw').addEventListener('input', () => { opts.pw = $('frPw').value.trim(); });
$('frCopy').onclick = () => {
  const done = () => toast(tr('copied') + ': ' + NET.code);
  try { navigator.clipboard.writeText(NET.code).then(done, () => toast(NET.code)); } catch (e) { toast(NET.code); }
};
setInterval(() => { if ($('s-friends').classList.contains('on')) frRender(); }, 1000);
})();

</script>
